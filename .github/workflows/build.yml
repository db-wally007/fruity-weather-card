name: Build

# VERIFY ONLY — this workflow must not commit dist/.
#
# The checkout that produces dist/ is also the copy Home Assistant serves, so
# the committed bundle is deliberately the one actually running. When CI also
# rebuilt and committed it, the two fought: a different esbuild version on the
# runner reflows the minified output by several hundred lines on every push,
# for no functional change. So CI proves the source compiles and builds, and
# the author commits the bundle.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Warn if the committed bundle is stale
        run: |
          if git diff --quiet -- dist; then
            echo "dist/ matches a fresh build of the source."
          else
            echo "::warning::dist/ differs from a fresh build. Some of that is"
            echo "::warning::esbuild-version churn; if you changed src/, rebuild"
            echo "::warning::locally with 'npm run build' and commit the result."
            git diff --stat -- dist
          fi
